name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: facturas
          POSTGRES_PASSWORD: facturas
          POSTGRES_DB: facturas
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U facturas" --health-interval 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://facturas:facturas@localhost:5432/facturas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Migraciones de Alembic (PostgreSQL real)
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head

      - name: Pytest con cobertura
        run: pytest --cov --cov-report=term-missing --cov-fail-under=70

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build de la imagen
        run: docker build -t extractor-facturas .
