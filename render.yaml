# Blueprint de Render: New → Blueprint → seleccionar este repositorio.
services:
  - type: web
    name: extractor-facturas-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: extractor-facturas-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: RATE_LIMIT_PER_DAY
        value: "20"

  - type: web
    name: extractor-facturas-ui
    runtime: docker
    plan: free
    dockerCommand: sh -c "streamlit run ui/streamlit_app.py --server.port=$PORT --server.address=0.0.0.0"
    envVars:
      # URL pública de la API, p. ej. https://extractor-facturas-api.onrender.com
      - key: API_URL
        sync: false

databases:
  - name: extractor-facturas-db
    plan: free
    databaseName: facturas
